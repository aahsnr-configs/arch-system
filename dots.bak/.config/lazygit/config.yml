customCommands:
- command: git commit --amend --no-edit
  context: commits
  description: Amend commit without editing message
  key: E
- command: nvim {{.SelectedFile.Name}}
  context: files
  description: Open file in Neovim
  key: n
  output: terminal
- command: nvim -c "lua
    require(\"telescope.builtin\").git_files()"
  context: global
  description: Open AstroNvim with Telescope git files
  key: T
  output: terminal
- command: git push --force-with-lease
  context: global
  description: Force push with lease (safer)
  key: P
- command: git stash push -m "{{.Form.Message}}"
  context: files
  description: Stash with custom message
  key: S
  prompts:
  - initialValue: 'WIP: '
    key: Message
    title: Stash Message
    type: input
- command: nvim .
  context: global
  description: Open current repository in Neovim
  key: o
  output: terminal
- command: git checkout -b {{.Form.BranchName}}
  context: localBranches
  description: Create new branch
  key: N
  prompts:
  - initialValue: feature/
    key: BranchName
    title: Branch Name
    type: input
gui:
  border: rounded
  commitLength:
    show: true
  mouseEvents: true
  nerdFontsVersion: '3'
  scrollHeight: 2
  scrollPastBottom: true
  showBottomLine: true
  showBranchCommitHash: true
  showCommandLog: true
  showFileTree: true
  showListFooter: true
  showPanelJumps: true
  showRandomTip: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
  splitDiff: auto
keybinding:
  branches:
    checkoutBranch: <space>
    createPullRequest: o
    deleteBranch: d
    fastForward: f
    forceCheckoutBranch: F
    mergeIntoCurrentBranch: m
    pull: p
    push: P
    rebaseBranch: r
    renameBranch: R
    setUpstream: u
  commits:
    amendToCommit: A
    checkoutCommit: <space>
    cherryPickCopy: c
    createFixupCommit: F
    markCommitAsFixup: f
    moveDownCommit: <c-j>
    moveUpCommit: <c-k>
    openInBrowser: o
    pasteCommits: v
    pickCommit: p
    renameCommit: r
    renameCommitWithEditor: R
    revertCommit: t
    squashAboveCommits: S
    squashDown: s
    startInteractiveRebase: i
    tagCommit: T
    viewResetOptions: g
  files:
    amendLastCommit: A
    commitChanges: c
    commitChangesWithEditor: <c-o>
    commitChangesWithoutHook: C
    confirmDiscard: x
    fetch: f
    ignoreFile: i
    refreshFiles: r
    stashAllChanges: s
    toggleStagedAll: a
    viewResetOptions: D
    viewStashOptions: S
  universal:
    copyToClipboard: <c-o>
    diffingMenu: W
    filteringMenu: <c-s>
    gotoBottom: <end>
    gotoTop: <home>
    nextBlock: l
    nextItem: j
    nextItem-alt: <down>
    nextPage: <c-d>
    nextTab: ']'
    openRecentRepos: <c-r>
    prevBlock: h
    prevItem: k
    prevItem-alt: <up>
    prevPage: <c-u>
    prevTab: '['
    quit: q
    quit-alt1: <c-c>
    quitWithoutChangingDirectory: Q
    redo: <c-z>
    return: <esc>
    togglePanel: <tab>
    undo: z
os:
  copyToClipboardCmd: wl-copy
  editCommand: nvim
  editCommandTemplate: '{{editor}} "{{filename}}"'
  openCommand: xdg-open
  openLinkCommand: xdg-open {{link}}
  readFromClipboardCmd: wl-paste
