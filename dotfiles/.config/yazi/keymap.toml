[[mgr.prepend_keymap]]
desc = "Open Lazygit"
on = ["g", "g"]
run = "plugin lazygit"

[[mgr.prepend_keymap]]
desc = "Show git status"
on = ["g", "s"]
run = "plugin git"

[[mgr.prepend_keymap]]
desc = "Toggle parent pane"
on = ["z", "p"]
run = "plugin toggle-pane --args='parent'"

[[mgr.prepend_keymap]]
desc = "Maximize preview pane"
on = ["z", "m"]
run = "plugin toggle-pane --args='max-preview'"

[[mgr.prepend_keymap]]
desc = "Remove"
on = ["d", "d"]
run = "remove"

[[mgr.prepend_keymap]]
desc = "Change permissions"
on = ["c", "m"]
run = "plugin chmod"

[[mgr.prepend_keymap]]
desc = "Save bookmark"
on = ["m", "a"]
run = "plugin yamb --args=save"

[[mgr.prepend_keymap]]
desc = "Jump to bookmark by key"
on = ["m", "g"]
run = "plugin yamb --args=jump_by_key"

[[mgr.prepend_keymap]]
desc = "Jump to bookmark by fzf"
on = ["m", "G"]
run = "plugin yamb --args=jump_by_fzf"

[[mgr.prepend_keymap]]
desc = "Delete bookmark by key"
on = ["m", "d"]
run = "plugin yamb --args=delete_by_key"

[[mgr.prepend_keymap]]
desc = "Delete bookmark by fzf"
on = ["m", "D"]
run = "plugin yamb --args=delete_by_fzf"

[[mgr.prepend_keymap]]
desc = "Delete all bookmarks"
on = ["m", "C"]
run = "plugin yamb --args=delete_all"

[[mgr.prepend_keymap]]
desc = "Rename bookmark by key"
on = ["m", "r"]
run = "plugin yamb --args=rename_by_key"

[[mgr.prepend_keymap]]
desc = "Rename bookmark by fzf"
on = ["m", "R"]
run = "plugin yamb --args=rename_by_fzf"

[[mgr.prepend_keymap]]
desc = "Go back"
on = "h"
run = "leave"

[[mgr.prepend_keymap]]
desc = "Move down"
on = "j"
run = "arrow 1"

[[mgr.prepend_keymap]]
desc = "Move up"
on = "k"
run = "arrow -1"

[[mgr.prepend_keymap]]
desc = "Smart enter (open file or enter directory)"
on = "l"
run = "plugin smart-enter"

[[mgr.prepend_keymap]]
desc = "Move to bottom"
on = "G"
run = "arrow bot"

[[mgr.prepend_keymap]]
desc = "Move to top"
on = "g"
run = "arrow top"

[[mgr.prepend_keymap]]
desc = "Jump to char"
on = "f"
run = "plugin jump-to-char"

[[mgr.prepend_keymap]]
desc = "Copy"
on = "y"
run = "yank"

[[mgr.prepend_keymap]]
desc = "Cut"
on = "x"
run = "yank --cut"

[[mgr.prepend_keymap]]
desc = "Smart paste"
on = "p"
run = "plugin smart-paste"

[[mgr.prepend_keymap]]
desc = "Create"
on = "a"
run = "create"

[[mgr.prepend_keymap]]
desc = "Rename"
on = "r"
run = "rename"

[[mgr.prepend_keymap]]
desc = "Toggle preview pane"
on = "T"
run = "plugin toggle-pane --args='preview'"

[[mgr.prepend_keymap]]
desc = "Smart filter"
on = "/"
run = "plugin smart-filter"

[[mgr.prepend_keymap]]
desc = "Search with fd"
on = "s"
run = "search fd"

[[mgr.prepend_keymap]]
desc = "Search with ripgrep"
on = "S"
run = "search rg"

[[mgr.prepend_keymap]]
desc = "New tab"
on = "t"
run = "tab_create --current"

[[mgr.prepend_keymap]]
desc = "Close tab"
on = "w"
run = "tab_close"

[[mgr.prepend_keymap]]
desc = "Previous tab"
on = "["
run = "tab_switch -1 --relative"

[[mgr.prepend_keymap]]
desc = "Next tab"
on = "]"
run = "tab_switch 1 --relative"

[[mgr.prepend_keymap]]
desc = "Switch to tab 1"
on = "1"
run = "tab_switch 0"

[[mgr.prepend_keymap]]
desc = "Switch to tab 2"
on = "2"
run = "tab_switch 1"

[[mgr.prepend_keymap]]
desc = "Switch to tab 3"
on = "3"
run = "tab_switch 2"

[[mgr.prepend_keymap]]
desc = "Switch to tab 4"
on = "4"
run = "tab_switch 3"

[[mgr.prepend_keymap]]
desc = "Switch to tab 5"
on = "5"
run = "tab_switch 4"

[[mgr.prepend_keymap]]
desc = "Quit"
on = "q"
run = "quit"

[[mgr.prepend_keymap]]
desc = "Shell"
on = ":"
run = "shell --interactive"

[[mgr.prepend_keymap]]
desc = "Shell (blocking)"
on = "!"
run = "shell --block"

[[mgr.prepend_keymap]]
desc = "Help"
on = "?"
run = "help"

[[mgr.prepend_keymap]]
desc = "Toggle hidden files"
on = "<C-h>"
run = "hidden toggle"

[[mgr.prepend_keymap]]
desc = "Suspend"
on = "<C-z>"
run = "suspend"

[[mgr.prepend_keymap]]
desc = "Diff selected and hovered files"
on = "="
run = "plugin diff"
